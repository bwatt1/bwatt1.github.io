<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects - Ben Watt</title>
    <meta name="description" content="Engineering projects of Ben Watt">
    <meta name="author" content="Ben Watt">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- HEADER -->
    <div id="header">
        <div class="container">
            <h1 id="name-title">Ben Watt</h1>
            <nav id="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a class="active" href="projects.html">Projects</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- PROJECTS CONTAINER -->
    <div id="project-page">
        <!-- Dynamic project cards injected here -->
    </div>

<script>
const username = "bwatt1";
const container = document.getElementById("project-page");

const placeholderImg = "img/placeholder.jpg";
const imageExtensions = ["png", "jpg", "jpeg", "webp"];

fetch(`https://api.github.com/users/${username}/repos?sort=updated`)
    .then(res => res.json())
    .then(repos => {
        repos.forEach(repo => {

            // Hide GitHub Pages repo
            if (repo.name.toLowerCase() === `${username}.github.io`) return;

            const project = document.createElement("a");
            project.className = "project";
            project.href = `project.html?repo=${repo.name}`;

            const img = document.createElement("img");
            img.className = "project-img";
            img.alt = repo.name;
            img.src = placeholderImg; // default fallback

            // Try loading projectcard image
            let imageFound = false;
            for (const ext of imageExtensions) {
                const testImg = new Image();
                const url = `https://raw.githubusercontent.com/${username}/${repo.name}/main/projectcard-img.${ext}`;

                testImg.onload = () => {
                    if (!imageFound) {
                        img.src = url;
                        imageFound = true;
                    }
                };

                testImg.src = url;
            }

            const titleDiv = document.createElement("div");
            titleDiv.className = "project-title";
            titleDiv.textContent = repo.name;

            const descDiv = document.createElement("div");
            descDiv.className = "project-desc";

            const nameDiv = document.createElement("div");
            nameDiv.className = "project-name";
            nameDiv.textContent = repo.name;

            const dateDiv = document.createElement("div");
            dateDiv.className = "project-date";
            dateDiv.textContent =
                `Created ${new Date(repo.created_at).toLocaleDateString()}`;

            const longDiv = document.createElement("div");
            longDiv.className = "project-longdesc";
            longDiv.textContent =
                repo.description || "No description provided.";

            descDiv.append(nameDiv, dateDiv, longDiv);
            project.append(img, titleDiv, descDiv);
            container.appendChild(project);
        });
    })
    .catch(err => console.error("GitHub fetch failed:", err));
</script>

</body>
</html>
