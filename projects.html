<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects - Ben Watt</title>
    <meta name="description" content="Engineering projects of Ben Watt">
    <meta name="author" content="Ben Watt">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- HEADER -->
    <div id="header">
        <div class="container">
            <h1 id="name-title">Ben Watt</h1>
            <nav id="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a class="active" href="projects.html">Projects</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- PROJECTS CONTAINER -->
    <div id="project-page">
        <!-- Dynamic project cards injected here -->
    </div>

    <script>
const username = "bwatt1"; // your GitHub username
const container = document.getElementById("project-page");

// Placeholder images
const placeholderImages = [
    "img/esk8_r1_img1.jpg",
    "img/esc_img1.jpg",
    "img/tbc.jpg"
];

fetch(`https://api.github.com/users/${username}/repos?sort=updated`)
    .then(res => res.json())
    .then(repos => {
        repos.forEach((repo, index) => {
            // Skip the GitHub Pages repo
            if (repo.name.toLowerCase() === `${username}.github.io`) return;

            const project = document.createElement("a");
            project.classList.add("project");
            project.href = `project.html?repo=${repo.name}`;

            project.target = "_blank";

            // Random placeholder image
            const img = document.createElement("img");
            img.classList.add("project-img");
            img.src = placeholderImages[index % placeholderImages.length];
            img.alt = repo.name;

            const titleDiv = document.createElement("div");
            titleDiv.classList.add("project-title");
            titleDiv.textContent = repo.name;

            const descDiv = document.createElement("div");
            descDiv.classList.add("project-desc");

            const nameDiv = document.createElement("div");
            nameDiv.classList.add("project-name");
            nameDiv.textContent = repo.name;

            const dateDiv = document.createElement("div");
            dateDiv.classList.add("project-date");
            dateDiv.textContent = new Date(repo.created_at).toLocaleDateString();

            const longDiv = document.createElement("div");
            longDiv.classList.add("project-longdesc");
            longDiv.textContent = repo.description || "No description available.";

            descDiv.appendChild(nameDiv);
            descDiv.appendChild(dateDiv);
            descDiv.appendChild(longDiv);

            project.appendChild(img);
            project.appendChild(titleDiv);
            project.appendChild(descDiv);

            container.appendChild(project);
        });
    })
    .catch(err => console.error(err));

    </script>
</body>
</html>
